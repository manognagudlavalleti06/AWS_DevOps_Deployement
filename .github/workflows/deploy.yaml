name: Deploy Lambda and Glue

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: test-cloudformationtemplate
  STACK_NAME: DevOps-Lambda-Glue-Stack
  LAMBDA_S3_KEY: lambda/app.zip
  GLUE_S3_KEY: glue/TestGlueJob.py

jobs:

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout GitHub repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------
      # 2. Configure AWS credentials using OIDC
      # --------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------
      # 3. Create Lambda ZIP package
      # --------------------------------------------------

      - name: Package Lambda
        run: |
          cd test_lambda
          zip -r ../app.zip app.py
          cd ..


      # --------------------------------------------------
      # 4. Upload Lambda package to S3
      # --------------------------------------------------

      - name: Upload Lambda package
        run: |
          aws s3 cp app.zip \
            s3://${S3_BUCKET}/${LAMBDA_S3_KEY}


      # --------------------------------------------------
      # 5. Upload Glue Python script to S3
      # --------------------------------------------------

      - name: Upload Glue script
        run: |
          aws s3 cp test_glue/glue.py \
            s3://${S3_BUCKET}/${GLUE_S3_KEY}


      # --------------------------------------------------
      # 6. Validate CloudFormation template
      # --------------------------------------------------

      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/template.yaml


      # --------------------------------------------------
      # 7. Deploy CloudFormation
      # --------------------------------------------------

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/template.yaml \
            --stack-name ${STACK_NAME} \
            --parameter-overrides \
              S3BucketName=${S3_BUCKET} \
              LambdaS3Key=${LAMBDA_S3_KEY} \
              GlueS3Key=${GLUE_S3_KEY} \
            --capabilities CAPABILITY_NAMED_IAM

      # --------------------------------------------------
      # 8. Display deployment information
      # --------------------------------------------------

      - name: Deployment complete
        run: |
          echo "========================================"
          echo "Deployment completed successfully!"
          echo "========================================"

          aws cloudformation describe-stacks \
            --stack-name ${STACK_NAME} \
            --query "Stacks[0].Outputs"


